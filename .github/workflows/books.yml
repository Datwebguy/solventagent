# Backup for Solvent's hourly bookkeeping. The main timer calls the website's /api/keep; this
# runs the same pass in case that timer misses. A shared lock stops the two from overlapping.
# It never sends a transaction and does not have the wallet's private key.
name: Keep the books

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: books
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsx src/keeper.ts
        env:
          SOLVENT_PUBLISH: "1"
          SOLVENT_TREASURY_ADDRESS: ${{ vars.SOLVENT_TREASURY_ADDRESS }}
          USEPOD_API_TOKEN: ${{ secrets.USEPOD_API_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
