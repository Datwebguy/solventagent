# Rebuilds the Clawrena earnings ranking from public blockchain records twice a day and
# publishes it for the website. Read-only: it never sends a transaction.
name: Refresh the ranking

on:
  schedule:
    # Twice a day: GitHub sometimes skips a scheduled run when it is busy.
    - cron: "23 3,15 * * *"
  workflow_dispatch:

concurrency:
  group: ranking
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsx src/cli.ts index:build 40
        env:
          SOLVENT_PUBLISH: "1"
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
